# =============================================
#  Your Wedding Website Configuration
#  Replace all placeholder values below!
# =============================================

remote_theme: cnorick/jekyll-theme-easy-wedding

# Change these to your names and details
title: Aldi & Dario       # Shows in browser tab & nav
email: aldidarioforever@gmail.com
url: https://aldidarioforever-ctrl.github.io # Full URL of your site (include https://)
description: "We're getting married and can't wait to celebrate with you!"
baseurl: ""

collections:
  stories:
    sort_by: order
  banners:

sass:
  style: compressed

defaults:
  - scope:
      path: "photos/"
    values:
      image: true
  - scope:
      type: banners
    values:
      layout: banner

# Build settings
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - _compress_images_cache.yml
