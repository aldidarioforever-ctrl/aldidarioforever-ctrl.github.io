<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    var userLang = navigator.language || navigator.userLanguage;
    if (userLang.startsWith('es')) {
      window.location.href = "{{ '/es/' | relative_url }}";
    } else {
      window.location.href = "{{ '/en/' | relative_url }}";
    }
  </script>
</head>
